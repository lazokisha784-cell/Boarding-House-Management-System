{% extends 'base.html' %}

{% block title %}New Maintenance Request{% endblock %}
{% block page_title %}New Maintenance Request{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-header">
        <h2 class="card-title">
            <i class="fas fa-wrench" style="color: var(--warning);"></i>
            File Room Maintenance / Repair Ticket
        </h2>
        <a href="{{ url_for('maintenance') }}" class="btn btn-outline btn-sm">
            <i class="fas fa-arrow-left"></i> Back to Maintenance
        </a>
    </div>

    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="room_id">Select Room <span style="color: var(--danger);">*</span></label>
                <select id="room_id" name="room_id" class="form-control" required>
                    <option value="">-- Choose Room --</option>
                    {% for room in rooms %}
                        <option value="{{ room.id }}">Room {{ room.room_number }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="tenant_id">Reporting Tenant (Optional)</label>
                <select id="tenant_id" name="tenant_id" class="form-control">
                    <option value="">-- None / Management Reported --</option>
                    {% for tenant in tenants %}
                        <option value="{{ tenant.id }}">{{ tenant.full_name }} {% if tenant.room %}(Room {{ tenant.room.room_number }}){% endif %}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="title">Issue Summary / Title <span style="color: var(--danger);">*</span></label>
            <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Leaking bathroom pipe, AC unit not cooling, Broken window latch" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Detailed Description of the Issue <span style="color: var(--danger);">*</span></label>
            <textarea id="description" name="description" class="form-control" placeholder="Describe the problem, severity, and any actions taken..." required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="priority">Priority Level</label>
                <select id="priority" name="priority" class="form-control">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                    <option value="Urgent">Urgent</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="cost">Estimated Repair Cost (₱)</label>
                <input type="number" step="0.01" min="0" id="cost" name="cost" class="form-control" placeholder="0.00" value="0.00">
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('maintenance') }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-check-circle"></i> Submit Maintenance Ticket
            </button>
        </div>
    </form>
</div>
{% endblock %}
